<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B217F">
<meta name="description" content="Painel de conferência das coletas do Mercado Livre — RVD Saúde.">
<title>Coletas Mercado Livre</title>
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
          color-scheme: light; }
  body { margin:0; font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  img { max-width:100%; }
  [hidden] { display:none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabecalho fixo da marca > abas por coleta > barra de busca colante > lista de pedidos em cartoes tocaveis */
:root {
  --roxo:#7B217F; --roxo-forte:#5F1863; --azul:#8FBED1; --azul-fundo:#EAF3F7;
  --bg:#FBF7FC; --superficie:#FFFFFF; --superficie-2:#F6EFF7;
  --fg:#2C1F2E; --suave:#7A6880; --linha:#E8DCEA;
  --ok-bg:#E7F1F6; --ok-fg:#245C73; --ok-br:#A9CCDC;
  --sep-bg:#FFF3DA; --sep-fg:#8A5A00; --sep-br:#E6BC68;
  --erro-bg:#FBE2E2; --erro-fg:#9B1C1C; --erro-br:#E29595;
  --feito:#1E7A52; --feito-bg:#E6F4EC; --feito-br:#9ED3B7;
  --sombra:0 1px 2px rgba(60,20,65,.06), 0 6px 18px rgba(60,20,65,.05); --selo-fg:#FFFFFF;
  --display:'Poppins',system-ui,sans-serif; --texto:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --roxo:#C98BCD; --roxo-forte:#E0B4E3; --azul:#8FBED1; --azul-fundo:#1E2C33;
  --bg:#15101733; --bg:#151017; --superficie:#1F1823; --superficie-2:#281F2D;
  --fg:#F1E7F2; --suave:#AE9BB2; --linha:#342A39;
  --ok-bg:#1B2C34; --ok-fg:#9FD0E3; --ok-br:#36596A;
  --sep-bg:#332814; --sep-fg:#F0C070; --sep-br:#6B5223;
  --erro-bg:#3A1E1E; --erro-fg:#F0A3A3; --erro-br:#6E3838;
  --feito:#6FD3A3; --feito-bg:#16301F; --feito-br:#2F6B4C;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28); --selo-fg:#2A0F2C;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --roxo:#C98BCD; --roxo-forte:#E0B4E3; --azul:#8FBED1; --azul-fundo:#1E2C33;
  --bg:#151017; --superficie:#1F1823; --superficie-2:#281F2D;
  --fg:#F1E7F2; --suave:#AE9BB2; --linha:#342A39;
  --ok-bg:#1B2C34; --ok-fg:#9FD0E3; --ok-br:#36596A;
  --sep-bg:#332814; --sep-fg:#F0C070; --sep-br:#6B5223;
  --erro-bg:#3A1E1E; --erro-fg:#F0A3A3; --erro-br:#6E3838;
  --feito:#6FD3A3; --feito-bg:#16301F; --feito-br:#2F6B4C;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28); --selo-fg:#2A0F2C;
  color-scheme: dark; }

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--texto);
       -webkit-text-size-adjust:100%; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
               background:var(--superficie); z-index:30; }
.wrap { padding-left:max(16px, env(safe-area-inset-left,0px));
        padding-right:max(16px, env(safe-area-inset-right,0px)); }
.limite { max-width:980px; margin:0 auto; }

/* ---- topo ---- */
header.topo { position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--superficie); border-bottom:1px solid var(--linha); }
.topo-in { display:flex; align-items:center; gap:14px; padding-block:12px; }
.marca { flex:none; background:#fff; border-radius:9px; padding:5px 8px;
  display:grid; place-items:center; box-shadow:var(--sombra); }
.marca img { height:28px; width:auto; display:block; }
.topo .tit { flex:1; min-width:0; }
.topo h1 { margin:0; font-family:var(--display); font-weight:700; font-size:1.08rem;
  letter-spacing:-.01em; color:var(--roxo); line-height:1.15; }
.topo .sub { font-size:.74rem; color:var(--suave); letter-spacing:.14em;
  text-transform:uppercase; margin-top:2px; font-weight:600; }
.selo { flex:none; background:var(--roxo); color:var(--selo-fg); border-radius:10px;
  padding:6px 11px; text-align:center; font-family:var(--display); }
.selo .r { font-size:.56rem; letter-spacing:.2em; text-transform:uppercase; opacity:.85; font-weight:600; }
.selo .v { font-size:.95rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }

/* ---- abas ---- */
.abas { display:flex; gap:8px; padding-block:12px 10px; }
.aba { flex:1; min-width:0; appearance:none; cursor:pointer; text-align:left;
  background:var(--superficie); border:1.5px solid var(--linha); border-radius:14px;
  padding:10px 12px; color:var(--fg); font-family:var(--texto); box-shadow:var(--sombra);
  transition:border-color .15s, background .15s; }
.aba:hover { border-color:var(--azul); }
.aba[aria-selected="true"] { border-color:var(--roxo); background:var(--superficie-2); }
.aba .n { font-family:var(--display); font-weight:700; font-size:.95rem; color:var(--roxo);
  display:flex; align-items:baseline; gap:7px; }
.aba .n em { font-style:normal; font-size:.78rem; font-weight:600; color:var(--suave);
  font-variant-numeric:tabular-nums; }
.aba .barra { height:6px; border-radius:99px; background:var(--linha); margin-top:8px; overflow:hidden; }
.aba .barra i { display:block; height:100%; background:var(--feito); border-radius:99px;
  transition:width .25s ease; }
.aba .cont { font-size:.73rem; color:var(--suave); margin-top:5px; font-weight:600;
  font-variant-numeric:tabular-nums; }

/* ---- resumo ---- */
.resumo { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-bottom:12px; }
.cx { background:var(--superficie); border:1px solid var(--linha); border-radius:12px;
  padding:9px 8px; text-align:center; }
.cx .r { font-size:.6rem; letter-spacing:.11em; text-transform:uppercase; color:var(--suave);
  font-weight:700; line-height:1.25; }
.cx .v { font-family:var(--display); font-size:1.25rem; font-weight:700; color:var(--fg);
  line-height:1.2; font-variant-numeric:tabular-nums; }
.cx.feito { background:var(--feito-bg); border-color:var(--feito-br); }
.cx.feito .v, .cx.feito .r { color:var(--feito); }
.cx.sep { background:var(--sep-bg); border-color:var(--sep-br); }
.cx.sep .v, .cx.sep .r { color:var(--sep-fg); }
.cx.erro { background:var(--erro-bg); border-color:var(--erro-br); }
.cx.erro .v, .cx.erro .r { color:var(--erro-fg); }

/* ---- busca ---- */
.barra-busca { position:sticky; top:calc(env(safe-area-inset-top,0px) + 59px); z-index:15;
  background:var(--bg); padding-block:8px 10px; }
.busca { display:flex; align-items:center; gap:9px; background:var(--superficie);
  border:1.5px solid var(--linha); border-radius:12px; padding:9px 12px; }
.busca svg { flex:none; color:var(--suave); }
.busca input { flex:1; min-width:0; border:0; outline:0; background:transparent;
  font:inherit; font-size:.95rem; color:var(--fg); }
.busca input::placeholder { color:var(--suave); }
.busca button { appearance:none; border:0; background:transparent; color:var(--suave);
  cursor:pointer; font:inherit; font-size:1.1rem; line-height:1; padding:0 2px; }
.chips { display:flex; gap:7px; margin-top:9px; overflow-x:auto; padding-bottom:2px;
  scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; appearance:none; cursor:pointer; border:1.5px solid var(--linha);
  background:var(--superficie); color:var(--suave); border-radius:99px; padding:6px 13px;
  font:inherit; font-size:.78rem; font-weight:600; white-space:nowrap; }
.chip[aria-pressed="true"] { border-color:var(--roxo); color:var(--roxo);
  background:var(--superficie-2); }

/* ---- lista ---- */
.lista { display:flex; flex-direction:column; gap:7px; padding-bottom:14px; }
.item { display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  appearance:none; cursor:pointer; font:inherit; background:var(--superficie);
  border:1.5px solid var(--linha); border-radius:13px; padding:10px 12px;
  box-shadow:var(--sombra); transition:border-color .15s, background .15s, opacity .15s; }
.item:hover { border-color:var(--azul); }
.item:focus-visible { outline:3px solid var(--azul); outline-offset:2px; }
.item .tick { flex:none; width:26px; height:26px; border-radius:8px;
  border:2px solid var(--roxo); background:transparent; display:grid; place-items:center;
  color:#fff; transition:background .15s, border-color .15s; }
.item .tick svg { opacity:0; transition:opacity .15s; }
.item .meio { flex:1; min-width:0; }
.item .linha1 { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.item .ped { font-family:var(--display); font-weight:700; font-size:1rem; color:var(--roxo);
  font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.item .nf { font-size:.76rem; font-weight:600; color:var(--suave);
  font-variant-numeric:tabular-nums; }
.item .nf.sem { font-style:italic; font-weight:500; }
.item .cli { font-size:.86rem; margin-top:2px; color:var(--fg); font-weight:500;
  overflow-wrap:anywhere; }
.item .dir { flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.item.feito { background:var(--feito-bg); border-color:var(--feito-br); }
.item.feito .tick { background:var(--feito); border-color:var(--feito); }
.item.feito .tick svg { opacity:1; }
.item.feito .cli { color:var(--suave); }
.item.feito .ped { color:var(--feito); }
.tag { display:inline-block; padding:3px 9px; border-radius:99px; font-size:.65rem;
  font-weight:700; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap; }
.tag.ok { background:var(--ok-bg); color:var(--ok-fg); border:1px solid var(--ok-br); }
.tag.sep { background:var(--sep-bg); color:var(--sep-fg); border:1px solid var(--sep-br); }
.tag.erro { background:var(--erro-bg); color:var(--erro-fg); border:1px solid var(--erro-br); }
.hora-marca { font-size:.64rem; color:var(--suave); font-variant-numeric:tabular-nums;
  font-weight:600; }
.vazio { text-align:center; color:var(--suave); padding:34px 10px; font-size:.9rem; }

/* ---- rodape ---- */
.acoes { display:flex; gap:8px; flex-wrap:wrap; padding-bottom:10px; }
.bt { appearance:none; cursor:pointer; font:inherit; font-size:.82rem; font-weight:600;
  border-radius:11px; padding:10px 15px; border:1.5px solid var(--linha);
  background:var(--superficie); color:var(--fg); }
.bt:hover { border-color:var(--azul); }
.bt.principal { background:var(--roxo); border-color:var(--roxo); color:var(--selo-fg); }
.bt.principal:hover { border-color:var(--roxo-forte); }
.bt[disabled] { opacity:.55; cursor:default; }
.bt.perigo[data-armado="1"] { border-color:var(--erro-br); background:var(--erro-bg);
  color:var(--erro-fg); }
.nota { font-size:.74rem; color:var(--suave); line-height:1.6; padding-bottom:22px; }
.nota b { color:var(--fg); font-weight:600; }
.faixa { height:10px; display:flex; }
.faixa i { display:block; height:100%; }
.faixa i:first-child { flex:1; background:var(--azul); }
.faixa i:last-child { flex:2.4; background:var(--roxo); }

@media (max-width:560px) {
  .resumo { grid-template-columns:repeat(2,1fr); }
  .topo h1 { font-size:.98rem; }
  .item .dir { align-items:flex-end; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>

const CHAVE = "rvd-coletas-v1";
const TAGS = { ok:["ok","OK"], sep:["sep","Em separa\u00e7\u00e3o"], erro:["erro","Erro"] };

let marcas = {};
try { marcas = JSON.parse(localStorage.getItem(CHAVE) || "{}") || {}; } catch (e) { marcas = {}; }
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(marcas)); } catch (e) {} }

let abaAtual = DADOS.coletas[0].id;
let filtro = "todos";
let busca = "";

const $ = (id) => document.getElementById(id);
const chave = (cid, p) => DADOS.data + "|" + cid + "|" + p;
const coleta = () => DADOS.coletas.find(c => c.id === abaAtual);
const feito = (cid, p) => !!marcas[chave(cid, p)];

function agora() {
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

/* ---------- abas ---------- */
function pintaAbas() {
  $("abas").innerHTML = "";
  DADOS.coletas.forEach(c => {
    const n = c.pedidos.length;
    const f = c.pedidos.filter(x => feito(c.id, x.p)).length;
    const b = document.createElement("button");
    b.className = "aba"; b.type = "button"; b.role = "tab";
    b.setAttribute("aria-selected", c.id === abaAtual ? "true" : "false");
    const nome = document.createElement("div"); nome.className = "n";
    nome.append(c.nome);
    const em = document.createElement("em"); em.textContent = c.hora; nome.append(em);
    const barra = document.createElement("div"); barra.className = "barra";
    const i = document.createElement("i"); i.style.width = (n ? (f / n * 100) : 0) + "%";
    barra.append(i);
    const cont = document.createElement("div"); cont.className = "cont";
    cont.textContent = f + " de " + n + " conferidos";
    b.append(nome, barra, cont);
    b.addEventListener("click", () => { abaAtual = c.id; pintaTudo(); });
    $("abas").append(b);
  });
}

/* ---------- resumo ---------- */
function pintaResumo() {
  const c = coleta(), ps = c.pedidos;
  const f = ps.filter(x => feito(c.id, x.p)).length;
  const dados = [
    ["Pedidos", ps.length, ""],
    ["Conferidos", f, "feito"],
    ["Em separa\u00e7\u00e3o", ps.filter(x => x.s === "sep").length, "sep"],
    ["Com erro", ps.filter(x => x.s === "erro").length, "erro"],
  ];
  $("resumo").innerHTML = "";
  dados.forEach(([r, v, cls]) => {
    const d = document.createElement("div"); d.className = "cx" + (cls ? " " + cls : "");
    const a = document.createElement("div"); a.className = "r"; a.textContent = r;
    const b = document.createElement("div"); b.className = "v"; b.textContent = v;
    d.append(a, b); $("resumo").append(d);
  });
}

/* ---------- chips ---------- */
function pintaChips() {
  const c = coleta(), ps = c.pedidos;
  const n = {
    todos: ps.length,
    pendentes: ps.filter(x => !feito(c.id, x.p)).length,
    conferidos: ps.filter(x => feito(c.id, x.p)).length,
    sep: ps.filter(x => x.s === "sep").length,
    erro: ps.filter(x => x.s === "erro").length,
  };
  const defs = [["todos","Todos"],["pendentes","Pendentes"],["conferidos","Conferidos"],
                ["sep","Em separa\u00e7\u00e3o"],["erro","Com erro"]];
  $("chips").innerHTML = "";
  defs.forEach(([k, rot]) => {
    if ((k === "sep" || k === "erro") && !n[k]) return;
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", filtro === k ? "true" : "false");
    b.textContent = rot + " \u00b7 " + n[k];
    b.addEventListener("click", () => { filtro = k; pintaChips(); pintaLista(); });
    $("chips").append(b);
  });
}

/* ---------- lista ---------- */
function pintaLista() {
  const c = coleta();
  const t = busca.trim().toLowerCase();
  const ps = c.pedidos.filter(x => {
    const f = feito(c.id, x.p);
    if (filtro === "pendentes" && f) return false;
    if (filtro === "conferidos" && !f) return false;
    if (filtro === "sep" && x.s !== "sep") return false;
    if (filtro === "erro" && x.s !== "erro") return false;
    if (!t) return true;
    return (x.p + " " + x.nf + " " + x.c).toLowerCase().includes(t);
  });
  const alvo = $("lista");
  alvo.innerHTML = "";
  if (!ps.length) {
    const v = document.createElement("p"); v.className = "vazio";
    v.textContent = t ? "Nenhum pedido encontrado para \u201c" + busca + "\u201d."
                      : "Nenhum pedido neste filtro.";
    alvo.append(v); return;
  }
  ps.forEach(x => {
    const k = chave(c.id, x.p), f = !!marcas[k];
    const b = document.createElement("button");
    b.className = "item" + (f ? " feito" : ""); b.type = "button";
    b.setAttribute("aria-pressed", f ? "true" : "false");

    const m = document.createElement("span"); m.className = "tick";
    m.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"' +
      ' stroke="currentColor" stroke-width="3.2" stroke-linecap="round"' +
      ' stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>';

    const meio = document.createElement("span"); meio.className = "meio";
    const l1 = document.createElement("span"); l1.className = "linha1";
    const ped = document.createElement("span"); ped.className = "ped"; ped.textContent = x.p;
    const nf = document.createElement("span");
    nf.className = "nf" + (x.nf ? "" : " sem");
    nf.textContent = x.nf ? "NF " + x.nf : "sem NF";
    l1.append(ped, nf);
    const cli = document.createElement("span"); cli.className = "cli"; cli.textContent = x.c;
    meio.append(l1, cli);

    const dir = document.createElement("span"); dir.className = "dir";
    if (x.s && TAGS[x.s]) {
      const tg = document.createElement("span");
      tg.className = "tag " + TAGS[x.s][0]; tg.textContent = TAGS[x.s][1];
      dir.append(tg);
    }
    if (f && marcas[k].h) {
      const h = document.createElement("span"); h.className = "hora-marca";
      h.textContent = marcas[k].h; dir.append(h);
    }

    b.append(m, meio, dir);
    b.addEventListener("click", () => {
      if (marcas[k]) { delete marcas[k]; } else { marcas[k] = { h: agora() }; }
      salvar(); pintaTudo();
    });
    alvo.append(b);
  });
}

function pintaTudo() { pintaAbas(); pintaResumo(); pintaChips(); pintaLista(); }

/* ---------- acoes ---------- */
$("busca").addEventListener("input", (e) => {
  busca = e.target.value; $("limpaBusca").hidden = !busca; pintaLista();
});
$("limpaBusca").addEventListener("click", () => {
  busca = ""; $("busca").value = ""; $("limpaBusca").hidden = true; $("busca").focus(); pintaLista();
});

$("btCopiar").addEventListener("click", async (e) => {
  const c = coleta();
  const pend = c.pedidos.filter(x => !feito(c.id, x.p));
  const linhas = [
    "RVD \u00b7 " + c.nome + " Mercado Livre \u00b7 " + c.hora + " \u00b7 " + DADOS.data,
    "Conferidos: " + (c.pedidos.length - pend.length) + " de " + c.pedidos.length,
  ];
  if (pend.length) {
    linhas.push("", "Pendentes (" + pend.length + "):");
    pend.forEach(x => linhas.push("\u2022 " + x.p + (x.nf ? " \u00b7 NF " + x.nf : " \u00b7 sem NF") + " \u00b7 " + x.c));
  } else { linhas.push("", "Todos os pedidos conferidos."); }
  const txt = linhas.join("\n");
  const bt = e.currentTarget;
  try {
    await navigator.clipboard.writeText(txt);
    bt.textContent = "Resumo copiado";
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    bt.textContent = "Selecione e copie";
    setTimeout(() => ta.remove(), 60000);
  }
  setTimeout(() => { bt.textContent = "Copiar resumo"; }, 2600);
});

$("btLimpar").addEventListener("click", (e) => {
  const bt = e.currentTarget;
  if (bt.dataset.armado === "0") {
    bt.dataset.armado = "1"; bt.textContent = "Confirmar limpeza";
    setTimeout(() => { if (bt.dataset.armado === "1") {
      bt.dataset.armado = "0"; bt.textContent = "Limpar marca\u00e7\u00f5es"; } }, 5000);
    return;
  }
  const c = coleta();
  c.pedidos.forEach(x => { delete marcas[chave(c.id, x.p)]; });
  salvar(); bt.dataset.armado = "0"; bt.textContent = "Limpar marca\u00e7\u00f5es"; pintaTudo();
});

const COR = {
  roxo:[123,33,127], azul:[143,190,209], verde:[30,122,82], suave:[122,104,128],
  texto:[44,31,46], linha:[226,214,228], zebra:[250,246,251], feitobg:[230,244,236],
  okbg:[231,241,246], okfg:[36,92,115], okbr:[169,204,220],
  sepbg:[255,243,218], sepfg:[138,90,0], sepbr:[230,188,104],
  errbg:[251,226,226], errfg:[155,28,28], errbr:[226,149,149],

function corta(doc, txt, larg) {
  if (doc.getTextWidth(txt) <= larg) return txt;
  let t = txt;
  while (t.length > 1 && doc.getTextWidth(t + "...") > larg) t = t.slice(0, -1);
  return t + "...";
}
function pilula(doc, x, y, rot, bg, br, fg) {
  doc.setFontSize(6.4); doc.setFont("helvetica", "bold");
  const w = doc.getTextWidth(rot) + 4;
  doc.setFillColor(bg[0],bg[1],bg[2]); doc.setDrawColor(br[0],br[1],br[2]);
  doc.setLineWidth(0.22); doc.roundedRect(x, y, w, 4, 2, 2, "FD");
  doc.setTextColor(fg[0],fg[1],fg[2]); doc.text(rot, x + w/2, y + 2.8, {align:"center"});
  return w;
}
function montaPDF() {
  const JS = window.jspdf && window.jspdf.jsPDF;
  if (!JS) return null;
  const doc = new JS({unit:"mm", format:"a4"});
  const W = 210, H = 297, M = 12, LIM = H - 18, ALT = 6.4;
  const xBox = M + 2.6, xPed = M + 9, xNF = M + 30, xCli = M + 51,
        cliW = 86, xSt = M + 139, xHora = W - M - 0.5;
  let pag = 0;

  function rodape() {
    pag += 1;
    doc.setFillColor(COR.azul[0],COR.azul[1],COR.azul[2]);
    doc.rect(0, H - 9, 62, 9, "F");
    doc.setFillColor(COR.roxo[0],COR.roxo[1],COR.roxo[2]);
    doc.rect(62, H - 9, W - 62, 9, "F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(7.4);
    doc.text("Conferido por ____________________        Data ____/____/______", 68, H - 3.4);
    doc.text("Página " + pag, W - M, H - 3.4, {align:"right"});
  }
  function cabTabela(y) {
    doc.setFillColor(COR.roxo[0],COR.roxo[1],COR.roxo[2]);
    doc.rect(M, y, W - 2*M, 6.4, "F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(6.6);
    doc.text("OK", xBox - 0.6, y + 4.2);
    doc.text("PEDIDO", xPed, y + 4.2);
    doc.text("NOTA FISCAL", xNF, y + 4.2);
    doc.text("CLIENTE", xCli, y + 4.2);
    doc.text("STATUS", xSt, y + 4.2);
    doc.text("HORA", xHora, y + 4.2, {align:"right"});
    return y + 6.4;
  }
  function cabColeta(c, cont) {
    try { doc.addImage(LOGO, "PNG", M, 10, 23, 16.4); } catch (e) {}
    doc.setTextColor(COR.roxo[0],COR.roxo[1],COR.roxo[2]);
    doc.setFont("helvetica","bold"); doc.setFontSize(15);
    doc.text("Coletas Mercado Livre", M + 28, 16.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    doc.setTextColor(COR.suave[0],COR.suave[1],COR.suave[2]);
    doc.text(c.nome + " · coleta " + c.hora + " · " + DADOS.data, M + 28, 22);
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.setTextColor(COR.verde[0],COR.verde[1],COR.verde[2]);
    doc.text(cont.feitos + " de " + cont.total + " conferidos", W - M, 16.5, {align:"right"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8);
    doc.setTextColor(COR.suave[0],COR.suave[1],COR.suave[2]);
    const extra = [];
    if (cont.sep) extra.push(cont.sep + " em separação");
    if (cont.erro) extra.push(cont.erro + " com erro");
    if (extra.length) doc.text(extra.join(" · "), W - M, 22, {align:"right"});
    doc.setDrawColor(COR.linha[0],COR.linha[1],COR.linha[2]); doc.setLineWidth(0.3);
    doc.line(M, 28.5, W - M, 28.5);
    return cabTabela(31.5);
  }

  DADOS.coletas.forEach((c, idx) => {
    const cont = {
      total: c.pedidos.length,
      feitos: c.pedidos.filter(x => feito(c.id, x.p)).length,
      sep: c.pedidos.filter(x => x.s === "sep").length,
      erro: c.pedidos.filter(x => x.s === "erro").length,
    };
    if (idx) doc.addPage();
    let y = cabColeta(c, cont);
    c.pedidos.forEach((x, i) => {
      if (y + ALT > LIM) { rodape(); doc.addPage(); y = cabColeta(c, cont); }
      const k = chave(c.id, x.p), f = !!marcas[k];
      if (f) { doc.setFillColor(COR.feitobg[0],COR.feitobg[1],COR.feitobg[2]); doc.rect(M, y, W-2*M, ALT, "F"); }
      else if (i % 2) { doc.setFillColor(COR.zebra[0],COR.zebra[1],COR.zebra[2]); doc.rect(M, y, W-2*M, ALT, "F"); }
      if (f) {
        doc.setFillColor(COR.verde[0],COR.verde[1],COR.verde[2]);
        doc.setDrawColor(COR.verde[0],COR.verde[1],COR.verde[2]); doc.setLineWidth(0.3);
        doc.roundedRect(xBox - 0.4, y + 1.3, 3.8, 3.8, 0.7, 0.7, "FD");
        doc.setDrawColor(255,255,255); doc.setLineWidth(0.55);
        doc.lines([[0.9,1.0],[1.9,-2.2]], xBox + 0.35, y + 3.1);
      } else {
        doc.setDrawColor(COR.roxo[0],COR.roxo[1],COR.roxo[2]); doc.setLineWidth(0.35);
        doc.roundedRect(xBox - 0.4, y + 1.3, 3.8, 3.8, 0.7, 0.7, "D");
      }
      doc.setFont("helvetica","bold"); doc.setFontSize(8.4);
      doc.setTextColor(COR.roxo[0],COR.roxo[1],COR.roxo[2]);
      doc.text(x.p, xPed, y + 4.3);
      doc.setFontSize(7.6);
      if (x.nf) { doc.setTextColor(COR.texto[0],COR.texto[1],COR.texto[2]); doc.text(x.nf, xNF, y + 4.3); }
      else { doc.setFont("helvetica","italic"); doc.setTextColor(COR.suave[0],COR.suave[1],COR.suave[2]);
             doc.text("sem NF", xNF, y + 4.3); }
      doc.setFont("helvetica","normal"); doc.setFontSize(7.8);
      doc.setTextColor(COR.texto[0],COR.texto[1],COR.texto[2]);
      doc.text(corta(doc, x.c.toUpperCase(), cliW), xCli, y + 4.3);
      if (x.s === "ok")   pilula(doc, xSt, y + 1.2, "OK", COR.okbg, COR.okbr, COR.okfg);
      if (x.s === "sep")  pilula(doc, xSt, y + 1.2, "EM SEPARAÇÃO", COR.sepbg, COR.sepbr, COR.sepfg);
      if (x.s === "erro") pilula(doc, xSt, y + 1.2, "ERRO", COR.errbg, COR.errbr, COR.errfg);
      if (f && marcas[k].h) {
        doc.setFont("helvetica","bold"); doc.setFontSize(7);
        doc.setTextColor(COR.verde[0],COR.verde[1],COR.verde[2]);
        doc.text(marcas[k].h, xHora, y + 4.3, {align:"right"});
      }
      doc.setDrawColor(COR.linha[0],COR.linha[1],COR.linha[2]); doc.setLineWidth(0.18);
      doc.line(M, y + ALT, W - M, y + ALT);
      y += ALT;
    });
    rodape();
  });
  return doc;
}

$("btPdf").addEventListener("click", async (e) => {
  const bt = e.currentTarget, rot = "Gerar PDF para imprimir";
  bt.disabled = true; bt.textContent = "Gerando PDF…";
  let doc = null;
  try { doc = montaPDF(); } catch (err) { doc = null; }
  if (!doc) {
    bt.textContent = "Não foi possível gerar";
    setTimeout(() => { bt.textContent = rot; bt.disabled = false; }, 3200); return;
  }
  const nome = "RVD_coletas_" + DADOS.data.replace(/\//g, "-") + ".pdf";
  let baixar = null;
  try { baixar = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }
  catch (err) { baixar = null; }
  if (baixar) {
    try { await baixar.save({ filename: nome, data: doc.output("blob") }); bt.textContent = "PDF salvo"; }
    catch (err) { bt.textContent = (err && err.code === "declined") ? "Download cancelado"
                                                                   : "Não foi possível salvar"; }
  } else {
    try { doc.save(nome); bt.textContent = "PDF salvo"; }
    catch (err) { bt.textContent = "Não foi possível salvar"; }
  }
  setTimeout(() => { bt.textContent = rot; bt.disabled = false; }, 3000);
});

$("dataRef").textContent = DADOS.data;
pintaTudo();
</script>
